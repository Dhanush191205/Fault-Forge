services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: faultforge
      POSTGRES_USER: faultforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U faultforge -d faultforge"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://faultforge:${POSTGRES_PASSWORD}@postgres:5432/faultforge
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      ALLOWED_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
    command: [sh, -c, "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://faultforge:${POSTGRES_PASSWORD}@postgres:5432/faultforge
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    command: [python, -m, app.worker]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  seed:
    profiles: [setup]
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://faultforge:${POSTGRES_PASSWORD}@postgres:5432/faultforge
    volumes:
      - ./data:/srv/data:ro
    command: [python, -m, app.seed, demo]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  chroma_data:
