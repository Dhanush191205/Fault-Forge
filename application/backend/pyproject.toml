[project]
name = "fault-forge"
version = "0.1.0"
description = "Grounded industrial maintenance training with audited simulation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "alembic>=1.14,<2", "reportlab>=4.3,<5",
]

[project.optional-dependencies]
vector = ["chromadb>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
